# Apply after creating relay-runtime Secret and publishing a container image.
apiVersion: apps/v1
kind: Deployment
metadata: { name: relay-api }
spec:
  replicas: 2
  selector: { matchLabels: { app: relay-api } }
  template:
    metadata: { labels: { app: relay-api, 'tags.datadoghq.com/service': relay-api } }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 10001, fsGroup: 10001 }
      containers:
        - name: api
          image: relay:0.1.0
          ports: [{ containerPort: 8000 }]
          envFrom: [{ secretRef: { name: relay-runtime } }]
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { cpu: '1', memory: 1Gi }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
          volumeMounts: [{ name: tmp, mountPath: /tmp }]
          readinessProbe: { httpGet: { path: /ready/, port: 8000 }, initialDelaySeconds: 10 }
          livenessProbe: { httpGet: { path: /health/, port: 8000 }, initialDelaySeconds: 15 }
      volumes: [{ name: tmp, emptyDir: {} }]
---
apiVersion: v1
kind: Service
metadata: { name: api }
spec:
  selector: { app: relay-api }
  ports: [{ port: 8000, targetPort: 8000 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: relay-worker }
spec:
  replicas: 2
  selector: { matchLabels: { app: relay-worker } }
  template:
    metadata: { labels: { app: relay-worker } }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 10001 }
      containers:
        - name: worker
          image: relay:0.1.0
          command: [celery, '-A', 'relay.tasks:app', worker, '--loglevel=INFO', '--concurrency=2']
          envFrom: [{ secretRef: { name: relay-runtime } }]
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { cpu: '1', memory: 1Gi }
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: [ALL] } }
---
apiVersion: batch/v1
kind: CronJob
metadata: { name: relay-outbox }
spec:
  schedule: '* * * * *'
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          securityContext: { runAsNonRoot: true, runAsUser: 10001 }
          containers:
            - name: dispatcher
              image: relay:0.1.0
              command: [python, '-c', 'from relay.transport import dispatch; print(dispatch())']
              envFrom: [{ secretRef: { name: relay-runtime } }]
              resources:
                requests: { cpu: 100m, memory: 256Mi }
                limits: { cpu: 500m, memory: 512Mi }
