[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "relay-intelligence"
version = "0.1.0"
description = "Evidence-led incident triage, delivered through durable events."
requires-python = ">=3.12"
dependencies = [
  "Django>=5.2,<5.3", "djangorestframework>=3.16,<3.17",
  "pymongo>=4.11,<5", "celery[redis]>=5.5,<6", "boto3>=1.36,<2",
  "scikit-learn>=1.6,<2", "gunicorn>=23,<24", "mangum>=0.19,<0.20",
]
[project.optional-dependencies]
gcp = ["google-cloud-pubsub>=2.29,<3"]
dev = ["pytest>=8.3,<9", "pytest-django>=4.10,<5", "mongomock>=4.3,<5", "ruff>=0.11,<1", "moto[dynamodb]>=5,<6", "jsonschema>=4.23,<5", "PyYAML>=6,<7"]
observability = ["ddtrace>=3,<4"]
[tool.setuptools.packages.find]
where = ["backend"]
[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]
DJANGO_SETTINGS_MODULE = "relay.settings"
[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]
[tool.setuptools.package-data]
relay = ["data/*.json"]
