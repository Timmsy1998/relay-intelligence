name: Relay checks
on: [push, pull_request]
permissions: { contents: read }
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12', cache: pip }
      - run: pip install -r requirements-dev.lock && pip install --no-deps -e .
      - run: ruff check backend scripts && ruff format --check backend scripts
      - run: pytest -q
      - run: python scripts/evaluate.py
      - run: python scripts/seed.py --export && git diff --exit-code frontend/src/demo.json
      - run: python scripts/check_infra.py
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: frontend }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run format:check && npm test && npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run dev > /tmp/relay-vite.log 2>&1 &
      - run: |
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:5173 >/dev/null; then break; fi
            sleep 1
          done
          npm run smoke
  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env && docker compose config --quiet
      - run: docker compose up -d --build --wait
      - run: docker compose exec -T api python scripts/seed.py
      - run: python scripts/compose_smoke.py
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci && npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run smoke:live
        working-directory: frontend
        env:
          RELAY_UI_URL: http://127.0.0.1:8080
      - if: always()
        run: docker compose logs && docker compose down -v
      - uses: aws-actions/setup-sam@v2
      - run: sam validate --lint --template-file infra/aws/template.yaml
      - run: sam build --template-file infra/aws/template.yaml
